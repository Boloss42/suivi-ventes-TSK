name: CI

# Vérifie chaque poussée sur main et chaque pull request : typecheck, tests
# unitaires et build de production. Objectif : bloquer toute régression avant
# qu'elle n'atteigne le déploiement Railway (qui suit main).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : ni le typecheck, ni les tests, ni le build n'ouvrent
      # de connexion à la base (routes dynamiques, aucune requête au build).
      # Prisma Client lit l'URL à l'instanciation mais ne se connecte jamais ici.
      DATABASE_URL: postgresql://user:password@localhost:5432/db
      AUTH_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build
